name: namify
description: "Find the perfect name for your pet"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  english_words: ^4.0.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.3.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icons for every platform: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#6C4CF5"
  adaptive_icon_foreground: assets/icon/foreground.png
  web:
    generate: true
    background_color: "#6C4CF5"
    theme_color: "#6C4CF5"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
